<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title description">
  <title id="title">Explorer un arbre de recherche</title>
  <desc id="description">Un arbre de décision interactif avec états, actions, nombre de visites et probabilités.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#202d40"/>
    </linearGradient>
    <linearGradient id="state" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1080" height="420" rx="26" fill="url(#background)"/>
  <g fill="none" stroke="#71839a" stroke-linecap="round" stroke-width="3">
    <path d="M540 132 300 211M540 132 780 211"/>
    <path d="m300 284-125 58M300 284l125 58M780 284l-125 58M780 284l125 58"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="54" y="58" fill="#f8fafc" font-size="23" font-weight="700">Une vue claire de vos arbres de recherche</text>
    <text x="54" y="86" fill="#9fb0c4" font-size="14">États · actions · probabilités · métriques</text>
    <g filter="url(#shadow)">
      <circle cx="540" cy="127" r="52" fill="url(#state)"/>
      <rect x="223" y="208" width="154" height="76" rx="18" fill="#24374d" stroke="#60a5fa" stroke-width="2"/>
      <rect x="703" y="208" width="154" height="76" rx="18" fill="#24374d" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="175" cy="348" r="39" fill="url(#state)"/>
      <circle cx="425" cy="348" r="39" fill="url(#state)"/>
      <circle cx="655" cy="348" r="39" fill="url(#state)"/>
      <circle cx="905" cy="348" r="39" fill="url(#state)"/>
    </g>
    <g text-anchor="middle">
      <text x="540" y="123" fill="#052e26" font-size="15" font-weight="700">ÉTAT</text>
      <text x="540" y="143" fill="#064e3b" font-size="12">N=1 240</text>
      <text x="300" y="238" fill="#dbeafe" font-size="15" font-weight="700">Action A</text>
      <text x="300" y="261" fill="#93c5fd" font-size="12">Q=0.72 · p=0.65</text>
      <text x="780" y="238" fill="#dbeafe" font-size="15" font-weight="700">Action B</text>
      <text x="780" y="261" fill="#93c5fd" font-size="12">Q=0.48 · p=0.35</text>
      <text x="175" y="352" fill="#052e26" font-size="12" font-weight="700">ÉTAT</text>
      <text x="425" y="352" fill="#052e26" font-size="12" font-weight="700">ÉTAT</text>
      <text x="655" y="352" fill="#052e26" font-size="12" font-weight="700">ÉTAT</text>
      <text x="905" y="352" fill="#052e26" font-size="12" font-weight="700">ÉTAT</text>
      <g fill="#cbd5e1" font-size="11">
        <text x="400" y="183">p=0.65</text>
        <text x="680" y="183">p=0.35</text>
        <text x="222" y="322">p=0.42</text>
        <text x="375" y="322">p=0.23</text>
        <text x="595" y="322">p=0.18</text>
        <text x="850" y="322">p=0.17</text>
      </g>
    </g>
